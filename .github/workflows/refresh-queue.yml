name: Refresh obsolete waiting build
on:
  push:
    branches: [main]
permissions:
  actions: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel superseded waiting orchestration without interrupting builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          run_id = 35522859791
          def get(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}'], text=True))
          run = get(f'actions/runs/{run_id}')
          if run['head_sha'] != 'c1878bc5ac202c02a849ff441e0d8766fc598036' or run['status'] == 'completed':
              raise SystemExit('The obsolete run is already finished or differs; no action.')
          jobs = get(f'actions/runs/{run_id}/jobs?per_page=100')['jobs']
          if any(job['status'] == 'in_progress' for job in jobs):
              raise SystemExit('A job is active; preserve its progress.')
          subprocess.run(['gh', 'api', '--method', 'POST', f'repos/{repo}/actions/runs/{run_id}/cancel'], check=True)
          PY
