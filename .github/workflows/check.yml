name: Check builder
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - uses: cachix/install-nix-action@v31
      - name: Parse Nix expressions
        run: |
          for file in *.nix cosmic/*.nix; do
            nix-instantiate --parse "$file" > /dev/null
          done
      - name: Lint workflows and check Nix formatting
        run: |
          nix run nixpkgs#actionlint
          nix run nixpkgs#nixfmt -- --check *.nix cosmic/*.nix
