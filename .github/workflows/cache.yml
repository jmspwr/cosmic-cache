name: Build and verify COSMIC cache
on:
  workflow_dispatch:
  schedule:
    - cron: '2/5 * * * *'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cosmic-cache
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  prepare:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
      matrix: ${{ steps.resolve.outputs.matrix }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci.py resolve
  build:
    if: needs.prepare.outputs.build == 'true'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      SOURCE_REV: ${{ needs.prepare.outputs.revision }}
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 2
      - name: Build one COSMIC output
        run: python3 scripts/ci.py build
      - name: Upload runtime closure only
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: python3 scripts/ci.py push
  publish:
    if: needs.prepare.outputs.build == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      SOURCE_REV: ${{ needs.prepare.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Verify downloads in a fresh runner and matching NixOS outputs
        run: python3 scripts/ci.py verify
      - name: Protect completed snapshots in Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: python3 scripts/ci.py retain
      - name: Advance cached branch without force-pushing
        run: python3 scripts/ci.py publish
