name: Retire other desktop builds
on:
  push:
    branches: [main]
permissions:
  actions: write
  contents: write
jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Stop retired pipelines and remove their publication branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path, method='GET'):
              return subprocess.run(['gh', 'api', '--method', method, f'repos/{repo}/{path}'], text=True, capture_output=True)
          for attempt in range(60):
              result = api('actions/runs?per_page=100')
              result.check_returncode()
              runs = [r for r in json.loads(result.stdout)['workflow_runs'] if r['name'] == 'Build verified desktop caches' and r['status'] != 'completed']
              if not runs:
                  break
              for run in runs:
                  result = api(f"actions/runs/{run['id']}/cancel", 'POST')
                  if result.returncode and '409' not in result.stderr:
                      raise RuntimeError(result.stderr)
                  print(f"Requested cancellation of retired run {run['id']}", flush=True)
              time.sleep(5)
          else:
              raise RuntimeError('Retired builds have not stopped; do not delete branches yet')
          for branch in ('plasma-cache', 'gnome-cache', 'lxqt-cache', 'audit/desktop-cache', 'checkpoint/plasma-2026-09-19'):
              result = api(f'git/refs/heads/{branch}', 'DELETE')
              if result.returncode and '422' not in result.stderr and '404' not in result.stderr:
                  raise RuntimeError(result.stderr)
              print(f'Retired {branch}')
          PY
      - name: Release discarded desktop cache pins
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base = 'https://app.cachix.org/api/v1/cache/jmspwr/pin'
          headers = {'Authorization': 'Bearer ' + os.environ['CACHIX_AUTH_TOKEN']}
          def request(url, method='GET'):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers, method=method), timeout=60) as response:
                  return response.read()
          pins = json.loads(request(base))
          retired = {'plasma-x86_64-linux', 'gnome-x86_64-linux', 'lxqt-x86_64-linux'}
          for pin in pins:
              if pin['name'] in retired:
                  request(base + '/' + pin['name'], 'DELETE')
                  print('Released retention:', pin['name'])
          remaining = json.loads(request(base))
          if any(pin['name'] in retired for pin in remaining):
              raise RuntimeError('A retired desktop is still pinned')
          print('Discarded desktops no longer have cache retention pins')
          PY
