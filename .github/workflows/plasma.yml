name: Build and verify Plasma cache
on:
  workflow_call:
    inputs:
      resume_run:
        description: Previous run whose exact snapshot should be resumed (optional)
        required: false
        type: string
      rev:
        description: nixpkgs packaging commit (Plasma Git heads are resolved separately)
        required: false
        type: string
      mode:
        description: Plasma sources
        type: string
        default: git
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true
permissions:
  contents: read
concurrency:
  group: plasma-cache
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
      build: ${{ steps.resolve.outputs.build }}
      l0: ${{ steps.resolve.outputs.l0 }}
      l1: ${{ steps.resolve.outputs.l1 }}
      l2: ${{ steps.resolve.outputs.l2 }}
      l3: ${{ steps.resolve.outputs.l3 }}
      l4: ${{ steps.resolve.outputs.l4 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: actions/download-artifact@v4
        if: inputs.resume_run != ''
        with:
          name: snapshot
          path: plasma
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
      - id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REV_OVERRIDE: ${{ inputs.rev }}
          SOURCE_MODE: ${{ inputs.mode || 'git' }}
        run: |
          if [ -f plasma/snapshot.json ]; then
            python3 -m plasma.ci resume
          else
            python3 -m plasma.ci resolve
          fi
      - uses: actions/upload-artifact@v4
        if: steps.resolve.outputs.build == 'true'
        with:
          name: snapshot
          path: plasma/snapshot.json
          if-no-files-found: error
  # Fixed runner waves, with batches derived from the complete Plasma dependency graph.
  l0:
    if: ${{ !cancelled() && needs.prepare.outputs.build == 'true' && !contains(needs.*.result, 'failure') }}
    needs: [prepare]
    uses: ./.github/workflows/plasma-build.yml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    with:
      revision: ${{ needs.prepare.outputs.revision }}
      packages: ${{ needs.prepare.outputs.l0 }}
  l1:
    if: ${{ !cancelled() && needs.prepare.outputs.build == 'true' && !contains(needs.*.result, 'failure') }}
    needs: [prepare, l0]
    uses: ./.github/workflows/plasma-build.yml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    with:
      revision: ${{ needs.prepare.outputs.revision }}
      packages: ${{ needs.prepare.outputs.l1 }}
  l2:
    if: ${{ !cancelled() && needs.prepare.outputs.build == 'true' && !contains(needs.*.result, 'failure') }}
    needs: [prepare, l0, l1]
    uses: ./.github/workflows/plasma-build.yml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    with:
      revision: ${{ needs.prepare.outputs.revision }}
      packages: ${{ needs.prepare.outputs.l2 }}
  l3:
    if: ${{ !cancelled() && needs.prepare.outputs.build == 'true' && !contains(needs.*.result, 'failure') }}
    needs: [prepare, l0, l1, l2]
    uses: ./.github/workflows/plasma-build.yml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    with:
      revision: ${{ needs.prepare.outputs.revision }}
      packages: ${{ needs.prepare.outputs.l3 }}
  l4:
    if: ${{ !cancelled() && needs.prepare.outputs.build == 'true' && !contains(needs.*.result, 'failure') }}
    needs: [prepare, l0, l1, l2, l3]
    uses: ./.github/workflows/plasma-build.yml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    with:
      revision: ${{ needs.prepare.outputs.revision }}
      packages: ${{ needs.prepare.outputs.l4 }}
  reference:
    if: ${{ !cancelled() && needs.prepare.outputs.build == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    needs: [prepare, l0, l1, l2, l3, l4]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_REV: ${{ needs.prepare.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: snapshot
          path: plasma
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 2
      - name: Build complete reference systems and check application identities
        run: python3 -m plasma.ci reference
      - name: Upload complete reference closures
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: python3 -m plasma.ci push-reference
      - uses: actions/upload-artifact@v4
        with:
          name: reference-systems
          path: plasma/reference-systems.json
          if-no-files-found: error
  publish:
    if: ${{ !cancelled() && needs.prepare.outputs.build == 'true' && needs.reference.result == 'success' }}
    needs: [prepare, reference]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      SOURCE_REV: ${{ needs.prepare.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: snapshot
          path: plasma
      - uses: actions/download-artifact@v4
        with:
          name: reference-systems
          path: plasma
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Verify downloads in a fresh runner and matching NixOS outputs
        run: python3 -m plasma.ci verify
      - name: Protect completed snapshots in Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: python3 -m plasma.ci retain
      - name: Advance plasma-cache without force-pushing
        run: python3 -m plasma.ci publish
